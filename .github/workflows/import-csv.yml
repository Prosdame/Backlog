name: Import Backlog CSV (SteamID & ITAD)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Run CSV Importer
        env:
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
        run: node scripts/import_csv.mjs

      - name: Commit backlog.json & unmatched.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backlog.json unmatched.csv
          if ! git diff --cached --quiet; then
            git commit -m "feat: import backlog from CSV via SteamID & ITAD"
            git push origin HEAD:main
          else
            echo "Nessuna modifica da salvare."
          fi
